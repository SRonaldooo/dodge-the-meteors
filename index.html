<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dodge the falling meteors and beat your high score."
    />
    <title>Dodge the Meteors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">BROWSER SURVIVAL GAME</p>
        <h1>Dodge the Meteors</h1>
        <p class="instructions">Move with <kbd>WASD</kbd> or <kbd>← ↑ ↓ →</kbd>. Survive as long as you can.</p>
      </header>

      <section class="game-card" aria-label="Dodge the Meteors game">
        <div class="scoreboard" aria-live="polite">
          <div><span>Score</span><strong id="score">0</strong></div>
          <div><span>Best</span><strong id="best-score">0</strong></div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="720" height="500" aria-label="Game area"></canvas>
          <div id="message" class="message" aria-live="assertive">
            <h2>Ready?</h2>
            <p>Dodge the meteors. The sky will not stay friendly for long.</p>
            <button id="start-button" type="button">Start game</button>
          </div>
        </div>

        <div class="controls">
          <button id="pause-button" type="button" disabled>Pause</button>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </section>

      <p class="tip">Tip: move diagonally to make tight escapes.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
